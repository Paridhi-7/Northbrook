<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DFD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F0E8;stop-opacity:1" />
    </linearGradient>
    <pattern id="cable" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="none"/>
      <path d="M15 0 C15 20 45 20 45 40 C45 60 15 60 15 80" stroke="#B7472A" stroke-width="0.6" fill="none" opacity="0.1"/>
      <path d="M30 0 C30 20 0 20 0 40 C0 60 30 60 30 80" stroke="#B7472A" stroke-width="0.4" fill="none" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#cable)"/>
  <!-- Texture circles -->
  <circle cx="200" cy="300" r="120" fill="#B7472A" opacity="0.04"/>
  <circle cx="600" cy="700" r="160" fill="#B7472A" opacity="0.04"/>
  <!-- Title -->
  <text x="400" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#B7472A" opacity="0.2" letter-spacing="6">WOMEN'S COLLECTION</text>
  <line x1="300" y1="490" x2="500" y2="490" stroke="#B7472A" stroke-width="1" opacity="0.15"/>
  <text x="400" y="530" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#B7472A" opacity="0.2" letter-spacing="3">COLLECTION IMAGE</text>
</svg>